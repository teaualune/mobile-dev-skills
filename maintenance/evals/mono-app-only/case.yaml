schema_version: "1.0"
name: mono-app-only
context:
  scaffold_script: monorepo.sh
graders:
  - name: fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:mobile-dev-skills:)?feature-intake"'
  - name: no-other-plugin-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:mobile-dev-skills:)?(?:feature-verify|mobile-build-deploy|feature-workflow|feature-scaffold|feature-spec|feature-spec-compact|mobile-store-deploy)"'
    min: 0
    max: 0
